<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Homeboard</title>
<link rel="stylesheet" href="/board.css">
<!-- Last, and outside the built-in layers, so its rules always win. -->
<link rel="stylesheet" href="/custom.css" id="custom-css">
<link rel="icon" href="data:,">
</head>
<body data-layout="left" data-legend="true">
<aside id="panel" data-part="panel"></aside>
<main data-part="calendar">
  <div id="legend" data-part="legend"></div>
  <div id="names" data-part="day-names"></div>
  <div id="grid" data-part="grid"></div>
</main>
<section id="night" data-part="night" hidden></section>
<div id="warn" data-part="warning" hidden></div>
<script type="module" src="/board.js"></script>
</body>
</html>
