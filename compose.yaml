# Homeboard on TrueNAS: Apps > Discover Apps > Custom App > Install via YAML.
# Replace POOL and the domain. Every HOMEBOARD_* variable is optional; anything set here is locked on the
# admin page. The full list is in docs/DEPLOY.md under "Settings reference".
services:
  homeboard:
    image: ghcr.io/joshoohaah/homeboard:latest   # or pin a version, e.g. :0.3.0
    restart: unless-stopped
    user: "568:568" # TrueNAS "apps" user: must own data/ and be able to read the files below
    ports:
      - "8480:8080"
    environment:
      PUBLIC_URL: https://board.example.com    # must match the Google redirect URI
      CONFIG_FILE: /config/homeboard.yaml       # calendars, color and shortening rules (see config.example.yaml)
      HOMEBOARD_TIMEZONE: America/Chicago
      HOMEBOARD_LATITUDE: "40.71"
      HOMEBOARD_LONGITUDE: "-74.01"
      HOMEBOARD_LAYOUT: left                    # left, right, top or calendar
      HOMEBOARD_WIDGETS: clock,weather,aqi,forecast,word,photos
      HOMEBOARD_WEEKS: "3"
      HOMEBOARD_QUIET: "true"
      HOMEBOARD_QUIET_WINDOWS: "sun-thu 21:30-06:30; fri,sat 23:00-08:00"
      # Secrets: read from files so they stay out of the app definition. Plain ADMIN_PASSWORD etc. also work.
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      DISPLAY_KEY_FILE: /run/secrets/display_key
      HOMEBOARD_ALERTS_WEBHOOK_FILE: /run/secrets/ha_webhook   # optional
    secrets: [admin_password, display_key, ha_webhook]
    volumes:
      - /mnt/POOL/apps/homeboard/data:/data                        # admin changes, Google sign-ins, custom.css
      - /mnt/POOL/apps/homeboard/homeboard.yaml:/config/homeboard.yaml:ro
      - /mnt/POOL/photos/board:/photos:ro                          # optional

secrets:
  admin_password:
    file: /mnt/POOL/apps/homeboard/secrets/admin_password
  display_key:
    file: /mnt/POOL/apps/homeboard/secrets/display_key
  ha_webhook:
    file: /mnt/POOL/apps/homeboard/secrets/ha_webhook
